[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "verigence-hrmgmt"
version = "0.1.0"
description = "Verigence HR Management service (employees, attendance, leave, reimbursement, payroll)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "PyJWT[crypto]==2.13.0",
    "httpx==0.28.1",
    "python-multipart==0.0.22",
    "boto3>=1.34,<2",
    "Pillow>=10,<13",
    "opencv-python-headless>=4.9,<5",
    "openpyxl>=3.1,<4",
    "reportlab>=4,<5",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
lint = [
    "ruff==0.16.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hrmgmt = ["email_assets/*.png", "face_models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is enforced by `ruff format`

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security", "fastapi.File"]
